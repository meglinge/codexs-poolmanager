# poolmanager entry HAProxy: Android-style A/B slots (see docker-compose.yml
# and deploy/abctl.py).
#
# The single public frontend looks up a runtime map (deploy/state/active.map,
# mounted at /etc/haproxy/state): `main -> manager_a | manager_b`. Only one
# slot receives traffic at a time; the other slot's backend is UP (ready, hot
# standby) but the map does not point at it. The deployment controller flips
# the in-memory map over the admin socket (milliseconds, no reload) and writes
# the same value to the file so a restart keeps the choice.

global
    log stdout format raw local0
    maxconn 4096
    # Admin socket (TCP): compose network (deployment service) + host 127.0.0.1:8405 only.
    stats socket ipv4@0.0.0.0:9999 level admin expose-fd listeners
    stats timeout 2m

defaults
    log     global
    mode    http
    option  httplog
    option  http-keep-alive
    option  forwardfor
    timeout connect 5s
    # Streaming responses can run for many minutes; after a slot switch the old
    # slot keeps serving its in-flight streams until they end on their own.
    timeout client  1h
    timeout server  1h
    timeout tunnel  24h
    timeout http-request 60s
    timeout http-keep-alive 75s
    retries 2
    default-server init-addr last,libc,none resolve-prefer ipv4 check inter 3s fall 2 rise 2

resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold other 10s
    hold refused 10s
    hold nx 10s
    hold timeout 10s
    hold obsolete 10s

frontend public
    bind *:8800
    http-request set-header X-Forwarded-Proto http
    use_backend %[str(main),map(/etc/haproxy/state/active.map,manager_a)]

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends

# One backend per slot. /readyz is 200 only when Postgres and Redis answer.
backend manager_a
    option httpchk GET /readyz
    http-check expect status 200
    server manager manager-a:8800 resolvers docker

backend manager_b
    option httpchk GET /readyz
    http-check expect status 200
    server manager manager-b:8800 resolvers docker

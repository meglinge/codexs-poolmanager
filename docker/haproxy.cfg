global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  http-keep-alive
    timeout connect 5s
    # Streaming responses can run for many minutes.
    timeout client  1h
    timeout server  1h
    timeout tunnel  1h
    retries 2
    option  redispatch

frontend public
    bind *:8800
    default_backend managers

backend managers
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200
    # A replica leaves rotation as soon as /healthz fails or the container
    # stops, so `docker compose up -d manager-a` then `manager-b` is a
    # zero-downtime update.
    server manager-a manager-a:8800 check inter 3s fall 2 rise 2
    server manager-b manager-b:8800 check inter 3s fall 2 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
